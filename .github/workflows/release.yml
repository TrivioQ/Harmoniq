# Releases the published packages (@harmoniq/client, cli, mf-plugin, build-plugin) with
# Changesets. On every push to main with pending changesets, opens or updates a
# "Version Packages" PR (versions + CHANGELOGs). Merging that PR publishes to npm with
# provenance and tags the release.
#
# Needs the repository secret NPM_TOKEN (an npm automation token for the @harmoniq scope).
name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write # version commits and tags
  pull-requests: write # the Version Packages PR
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.repository == 'TrivioQ/Harmoniq'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # version comes from package.json `packageManager`

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the published packages
        run: pnpm exec turbo run build --filter=@harmoniq/client --filter=@harmoniq/cli --filter=@harmoniq/mf-plugin --filter=@harmoniq/build-plugin

      - name: Version PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm exec changeset version
          publish: pnpm exec changeset publish
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
