name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379

    env:
      # Same role split as local Docker (docker/init.sql): owner vs RLS-bound tenant role.
      DATABASE_URL: postgresql://harmoniq_app:password@localhost:5433/harmoniq
      SYSTEM_DATABASE_URL: postgresql://harmoniq:password@localhost:5433/harmoniq
      REDIS_URL: redis://localhost:6380
      CACHE_ADAPTER: memory
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changelog:check diffs against the base branch

      - name: Install pnpm
        uses: pnpm/action-setup@v4 # version comes from package.json `packageManager`

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm exec prettier --check "**/*.{ts,tsx,md,json}"

      - name: Check feature docs were updated
        if: github.event_name == 'pull_request'
        run: pnpm run changelog:check origin/${{ github.base_ref }}

      - name: Create database roles
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -p 5433 -U postgres -v ON_ERROR_STOP=1 -f docker/init.sql

      - name: Run database migrations
        run: pnpm --filter @harmoniq/db exec prisma migrate deploy

      - name: Build (includes type checking)
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm test
