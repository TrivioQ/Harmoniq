name: Harmoniq deploy
description: Deploy (or promote) a micro frontend module with Harmoniq and summarize the change.
branding:
  icon: upload-cloud
  color: purple

inputs:
  registry-url:
    description: Harmoniq registry URL
    required: true
  api-key:
    description: API key with the deploy:write scope (store it as a secret)
    required: true
  workspace:
    description: Workspace slug
    required: true
  module:
    description: Module slug or id
    required: true
  environment:
    description: Target environment (deploy) or destination (promote)
    required: true
  version:
    description: Version being deployed (e.g. a tag or the commit SHA). Deploy only.
    required: false
  url:
    description: Public URL of the uploaded remote entry. Deploy only.
    required: false
  file:
    description: Local remote entry used to compute the integrity hash. Deploy only.
    required: false
  integrity:
    description: SRI hash, if not computed from `file`. Deploy only.
    required: false
  promote-from:
    description: Promote the version running in this environment instead of deploying.
    required: false
  preview-ttl-hours:
    description: Create `environment` (e.g. pr-123) as a preview environment that expires after this many hours. The workspace must allow preview environments.
    required: false
  dry-run:
    description: Validate and show the projected change without deploying.
    required: false
    default: 'false'
  cli:
    description: Command used to run the Harmoniq CLI.
    required: false
    default: npx --yes @harmoniq/cli

outputs:
  version-id:
    description: Id of the version record created
    value: ${{ steps.run.outputs.version-id }}
  manifest-etag:
    description: ETag of the manifest after the change
    value: ${{ steps.run.outputs.manifest-etag }}
  preview-url:
    description: Preview link, when the host app defines a preview URL template
    value: ${{ steps.run.outputs.preview-url }}

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        HARMONIQ_REGISTRY_URL: ${{ inputs.registry-url }}
        HARMONIQ_API_KEY: ${{ inputs.api-key }}
        HARMONIQ_WORKSPACE: ${{ inputs.workspace }}
        MODULE: ${{ inputs.module }}
        ENVIRONMENT: ${{ inputs.environment }}
        VERSION: ${{ inputs.version }}
        URL: ${{ inputs.url }}
        FILE: ${{ inputs.file }}
        INTEGRITY: ${{ inputs.integrity }}
        PROMOTE_FROM: ${{ inputs.promote-from }}
        DRY_RUN: ${{ inputs.dry-run }}
        PREVIEW_TTL: ${{ inputs.preview-ttl-hours }}
        CLI: ${{ inputs.cli }}
      run: |
        set -euo pipefail
        if [[ -n "$PROMOTE_FROM" ]]; then
          args=(promote --module "$MODULE" --from "$PROMOTE_FROM" --to "$ENVIRONMENT")
          action="Promoted $MODULE from $PROMOTE_FROM to $ENVIRONMENT"
        else
          args=(deploy --module "$MODULE" --env "$ENVIRONMENT" --release "$VERSION" --url "$URL")
          if [[ -n "$FILE" ]]; then args+=(--file "$FILE"); fi
          if [[ -n "$INTEGRITY" ]]; then args+=(--integrity "$INTEGRITY"); fi
          if [[ -n "$PREVIEW_TTL" ]]; then args+=(--preview-ttl "$PREVIEW_TTL"); fi
          action="Deployed $MODULE $VERSION to $ENVIRONMENT"
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
            action="Dry run: $MODULE $VERSION → $ENVIRONMENT"
          fi
        fi

        # The CLI exits non-zero on failure (2 invalid, 3 auth, 4 frozen, 5 conflict).
        result=$($CLI --json "${args[@]}")
        echo "$result"
        echo "version-id=$(jq -r '.id // empty' <<<"$result")" >> "$GITHUB_OUTPUT"
        echo "manifest-etag=$(jq -r '.manifestEtag // empty' <<<"$result")" >> "$GITHUB_OUTPUT"
        preview_url=$(jq -r '.previewUrl // empty' <<<"$result")
        echo "preview-url=$preview_url" >> "$GITHUB_OUTPUT"

        {
          echo "### $action"
          echo
          echo "| | |"
          echo "|---|---|"
          echo "| Version | \`$(jq -r '.version // "—"' <<<"$result")\` |"
          echo "| Manifest ETag | \`$(jq -r '.manifestEtag // "—"' <<<"$result")\` |"
          if [[ -n "$preview_url" ]]; then
            echo "| Preview | $preview_url |"
          fi
          if jq -e '.validation' >/dev/null <<<"$result"; then
            echo "| Validation errors | $(jq -r '.validation.errors | length' <<<"$result") |"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
