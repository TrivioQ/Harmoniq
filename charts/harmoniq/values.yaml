replicaCount: 1

image:
  registry: harmoniq/registry
  web: harmoniq/web
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  registryPort: 3002
  webPort: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: harmoniq.local
      paths:
        - path: /
          pathType: ImplementationSpecific

env:
  DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/harmoniq?schema=public"
  REDIS_URL: "redis://redis:6379"
  JWT_SECRET: "changeme"
  CACHE_ADAPTER: "redis"

postgres:
  enabled: true
  
redis:
  enabled: true
