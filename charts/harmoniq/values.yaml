replicaCount: 1

image:
  registry: harmoniq/registry
  web: harmoniq/web
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  registryPort: 4000
  webPort: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: harmoniq.local
      paths:
        - path: /
          pathType: ImplementationSpecific

env:
  REDIS_URL: "redis://redis:6379"
  CACHE_ADAPTER: "redis"
  NODE_ENV: "production"

# Sensitive values. Either set them here (rendered into a Secret) or point
# `existingSecret` at a Secret with keys DATABASE_URL, JWT_SECRET, HARMONIQ_ENCRYPTION_KEY.
# The chart refuses to render if they are missing; the registry refuses to start on defaults.
secrets:
  existingSecret: ""
  databaseUrl: ""
  jwtSecret: ""
  encryptionKey: ""

postgres:
  enabled: true
  
redis:
  enabled: true
