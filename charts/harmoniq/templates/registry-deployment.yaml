apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "harmoniq.fullname" . }}-registry
  labels:
    app.kubernetes.io/name: {{ include "harmoniq.name" . }}-registry
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "harmoniq.name" . }}-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "harmoniq.name" . }}-registry
    spec:
      containers:
        - name: {{ .Chart.Name }}-registry
          image: "{{ .Values.image.registry }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.existingSecret | default (include "harmoniq.fullname" .) }}
          env:
            - name: REDIS_URL
              value: {{ .Values.env.REDIS_URL | quote }}
            - name: CACHE_ADAPTER
              value: {{ .Values.env.CACHE_ADAPTER | quote }}
            - name: NODE_ENV
              value: {{ .Values.env.NODE_ENV | quote }}
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
