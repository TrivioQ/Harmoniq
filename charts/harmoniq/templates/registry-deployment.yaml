apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "harmoniq.fullname" . }}-registry
  labels:
    {{- include "harmoniq.labels" . | nindent 4 }}
    {{- include "harmoniq.selector" (dict "root" . "component" "registry") | nindent 4 }}
spec:
  replicas: {{ .Values.registry.replicaCount }}
  selector:
    matchLabels:
      {{- include "harmoniq.selector" (dict "root" . "component" "registry") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "harmoniq.selector" (dict "root" . "component" "registry") | nindent 8 }}
      annotations:
        # Roll the pods when the rendered Secret changes.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: registry
          image: {{ include "harmoniq.image" (dict "root" . "repository" .Values.image.registry) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ include "harmoniq.secretName" . }}
            {{- with .Values.registry.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- include "harmoniq.registryEnv" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.registry.port }}
              protocol: TCP
            {{- with .Values.registry.metricsPort }}
            - name: metrics
              containerPort: {{ . }}
              protocol: TCP
            {{- end }}
          # /health: the process is up; /ready: database and cache answer.
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
          resources:
            {{- toYaml .Values.registry.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
