{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "harmoniq.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "harmoniq.name" . }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "secrets.databaseUrl is required" .Values.secrets.databaseUrl | quote }}
  JWT_SECRET: {{ required "secrets.jwtSecret is required (min 32 random chars)" .Values.secrets.jwtSecret | quote }}
  HARMONIQ_ENCRYPTION_KEY: {{ required "secrets.encryptionKey is required (32 random bytes, base64)" .Values.secrets.encryptionKey | quote }}
{{- end }}
