{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "harmoniq.fullname" . }}
  labels:
    {{- include "harmoniq.labels" . | nindent 4 }}
  annotations:
    # Created before the migration hook, which needs it; kept on uninstall like any hook.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  DATABASE_URL: {{ required "secrets.databaseUrl is required (the harmoniq_app role)" .Values.secrets.databaseUrl | quote }}
  SYSTEM_DATABASE_URL: {{ required "secrets.systemDatabaseUrl is required (the harmoniq schema owner)" .Values.secrets.systemDatabaseUrl | quote }}
  JWT_SECRET: {{ required "secrets.jwtSecret is required (min 32 random chars)" .Values.secrets.jwtSecret | quote }}
  HARMONIQ_ENCRYPTION_KEY: {{ required "secrets.encryptionKey is required (32 random bytes, base64)" .Values.secrets.encryptionKey | quote }}
  {{- with .Values.secrets.setupToken }}
  HARMONIQ_SETUP_TOKEN: {{ . | quote }}
  {{- end }}
{{- end }}
